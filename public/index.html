<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonsa AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #1e293b;
      padding: 15px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      border-bottom: 1px solid #334155;
    }
    #chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.4;
    }
    .user {
      align-self: flex-end;
      background-color: #2563eb;
      color: #ffffff;
    }
    .bot {
      align-self: flex-start;
      background-color: #334155;
      color: #f8fafc;
    }
    form {
      display: flex;
      padding: 15px;
      background-color: #1e293b;
      gap: 10px;
      border-top: 1px solid #334155;
    }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #fff;
      outline: none;
    }
    button {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background-color: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <header>Bonsa AI Chat</header>

  <div id="chat-box"></div>

  <form id="chat-form">
    <input type="text" id="user-input" placeholder="Gaaffii kee asitti barreessi..." required>
    <button type="submit">Ergi</button>
  </form>

  <script>
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const chatBox = document.getElementById('chat-box');

    let messageHistory = [];

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      messageHistory.push({ role: 'user', content: text });
      userInput.value = '';

      const loadingDiv = appendMessage('Yaadaa jira...', 'bot');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: messageHistory })
        });

        const data = await response.json();
        chatBox.removeChild(loadingDiv);

        if (data.reply) {
          appendMessage(data.reply, 'bot');
          messageHistory.push({ role: 'assistant', content: data.reply });
        } else {
          appendMessage('Dogoggorri uumameera.', 'bot');
        }
      } catch (err) {
        chatBox.removeChild(loadingDiv);
        appendMessage('Server waliin qunnamtii uumuun hin danda'amne.', 'bot');
      }
    });

    function appendMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }
  </script>

</body>
</html>
